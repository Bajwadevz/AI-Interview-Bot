AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Conversational Orchestrator (FYP) - minimal SAM template (placeholder)

Globals:
  Function:
    Timeout: 30
    Runtime: python3.10

Resources:
  ConversationSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ConversationSessions
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  QuestionBankTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: QuestionBank
      AttributeDefinitions:
        - AttributeName: questionId
          AttributeType: S
      KeySchema:
        - AttributeName: questionId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
